[project]
name = "remote-runner"
version = "0.1.0"
description = "A python util for use remote toolchain at local project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = { text= "MIT" }
author = [{ name = "npp-zep" }]
keywords = ["remote-build", "ssh", "rsync", "toolchain"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]

[project.scripts]
remote-runner = "remote_runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_runner"]