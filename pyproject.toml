[project]
name = "remote-runner"
version = "0.1.0"
description = "A python util for use remote toolchain at local project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = "MIT"
authors = [{ name = "npp-zep" }]
keywords = ["remote-build", "ssh", "rsync", "toolchain"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]

[project.scripts]
remote-runner = "remote_runner.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"